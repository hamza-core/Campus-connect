openapi: 3.1.0
info:
  title: CampusConnect API
  version: 1.1.0
  description: |
    SINGLE SOURCE OF TRUTH for the frontend <-> backend boundary.
    Backend: ASP.NET Core (.NET 10) / EF Core / SQL Server on AWS (implemented by the backend agent).
    Frontend (Claude) builds against this file. v1.1.0 aligns the spec with the implemented backend (PR #3).
    Change rules live in /CONTRACT.md. Never edit this file in a feature PR that also
    changes app code - contract changes go in their own `contract:` PR first.
servers:
  - url: http://localhost:4000/api/v1
    description: Local
  - url: http://13.53.165.254/api/v1
    description: AWS EC2 behind Nginx (HTTP until a domain and certificate exist)
  - url: https://campusconnect-api.onrender.com/api/v1
    description: Production (update after deploy)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Complaints
  - name: Admin
  - name: Analytics
  - name: Meta

paths:
  /health:
    get:
      tags: [Meta]
      security: []
      summary: Liveness + database reachability probe
      responses:
        "503":
          description: SQL Server unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [unavailable] }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /meta/categories:
    get:
      tags: [Meta]
      security: []
      summary: Categories with their responsible department (drives the submit form)
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Student self-registration (admins are seeded, never registered)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login for any role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user (used to rehydrate session)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /uploads/sign:
    post:
      tags: [Complaints]
      summary: Get a signed upload (Cloudinary) for a complaint image. Student only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                fileSize: { type: integer, minimum: 1, maximum: 5242880, description: "Optional, bytes. Max 5 MB" }
      responses:
        "200":
          description: Signed upload params
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SignedUpload" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /complaints:
    post:
      tags: [Complaints]
      summary: Student submits a complaint. Department is derived server-side from category.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComplaintRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Complaint" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Complaints]
      summary: |
        Role-scoped list. STUDENT -> own only. DEPT_ADMIN -> own department only.
        SUPER_ADMIN -> everything. Scope is enforced server-side; query filters narrow within scope.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ComplaintStatus" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/CategoryKey" } }
        - { name: departmentId, in: query, description: "Ignored for DEPT_ADMIN / STUDENT", schema: { type: string } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: Text search over title/description/ticket, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, mostSupported, priority], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Paged complaints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintPage" }

  /complaints/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Complaints]
      summary: Complaint detail incl. timeline. 403 if outside the caller's scope (direct-URL protection).
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ComplaintDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /complaints/{id}/status:
    patch:
      tags: [Admin]
      summary: |
        DEPT_ADMIN of the owning department changes status. SUPER_ADMIN is READ-ONLY (403) and students get 403.
        Allowed: PENDING -> IN_PROGRESS | REJECTED; IN_PROGRESS -> RESOLVED | REJECTED. RESOLVED/REJECTED are terminal.
        `rowVersion` (from the last read) is required: missing/invalid -> 422, stale -> 409 CONFLICT.
        REJECTED and RESOLVED require a remark.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStatusRequest" }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ComplaintDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /complaints/{id}/comments:
    post:
      tags: [Complaints]
      summary: |
        DEPT_ADMIN of the owning department adds a remark visible to the student without changing status.
        SUPER_ADMIN and students get 403 (historical STUDENT_REPLY entries may still appear in timelines).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/TimelineEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /complaints/{id}/support:
    put:
      tags: [Complaints]
      deprecated: true
      summary: DEFERRED (issue #4). Always 403 for now; do not build UI against it. Original intent - "me too" toggle ON.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: New support state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportState" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Complaints]
      deprecated: true
      summary: DEFERRED (issue #4). Always 403 for now.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: New support state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportState" }

  /complaints/{id}/feedback:
    post:
      tags: [Complaints]
      summary: Owner rates a RESOLVED complaint (1-5). One per complaint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ComplaintDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /notifications:
    get:
      tags: [Complaints]
      summary: In-app notifications for the caller (status change, new remark). Poll every 30s.
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, unreadCount]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unreadCount: { type: integer }

  /notifications/read-all:
    post:
      tags: [Complaints]
      summary: Mark all my notifications read
      responses:
        "204": { description: Done }

  /analytics/summary:
    get:
      tags: [Analytics]
      summary: |
        KPI counts. SUPER_ADMIN -> system-wide (optional departmentId).
        DEPT_ADMIN -> own department only. STUDENT -> 403.
      parameters:
        - { name: departmentId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Summary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/by-department:
    get:
      tags: [Analytics]
      summary: Bar chart - complaints per department. SUPER_ADMIN only (dept admins get only their own row).
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DepartmentCount" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/by-status:
    get:
      tags: [Analytics]
      summary: Pie/donut - complaints per status (scoped by role)
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StatusCount" }

  /analytics/trend:
    get:
      tags: [Analytics]
      summary: Line chart - complaints created per day (scoped by role)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TrendPoint" }

  /analytics/recurring:
    get:
      tags: [Analytics]
      summary: Recurring issues - top issue clusters by support count + volume (admins only)
      responses:
        "200":
          description: Top recurring issues
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringIssue" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/complaints/export.csv:
    get:
      tags: [Admin]
      summary: CSV export of the caller's scoped complaints (honours the same filters as GET /complaints)
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but outside role/department scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict (duplicate, invalid transition)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many auth attempts (default 20/min per client IP). Code RATE_LIMITED.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Body/query failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, INVALID_TRANSITION, RATE_LIMITED, INTERNAL]
            message: { type: string }
            fields:
              type: object
              description: Field-level errors for VALIDATION_FAILED, keyed by field name
              additionalProperties: { type: string }

    Role:
      type: string
      enum: [STUDENT, DEPT_ADMIN, SUPER_ADMIN]

    CategoryKey:
      type: string
      enum: [CAFETERIA, LIBRARY, LAB_IT, ACADEMIC]

    ComplaintStatus:
      type: string
      description: |
        Allowed transitions (enforced server-side):
        PENDING -> IN_PROGRESS | REJECTED
        IN_PROGRESS -> RESOLVED | REJECTED
        RESOLVED / REJECTED are terminal. SUPER_ADMIN is read-only and cannot change status.
      enum: [PENDING, IN_PROGRESS, RESOLVED, REJECTED]

    Priority:
      type: string
      description: Chosen by student; super/dept admin may not change it (keeps audit simple).
      enum: [LOW, MEDIUM, HIGH]

    Department:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string, example: Library Administration }
        slug: { type: string, example: library }

    Category:
      type: object
      required: [key, label, description, subIssues, department]
      properties:
        key: { $ref: "#/components/schemas/CategoryKey" }
        label: { type: string }
        description: { type: string }
        subIssues:
          type: array
          description: Suggested issue types from the problem statement (e.g. "Poor food quality or hygiene")
          items: { type: string }
        department: { $ref: "#/components/schemas/Department" }

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        studentId: { type: [string, "null"], description: University roll/enrolment number (students only) }
        department: { oneOf: [{ $ref: "#/components/schemas/Department" }, { type: "null" }], description: Set for DEPT_ADMIN }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        studentId: { type: string, maxLength: 30 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: "JWT, 7d expiry. Sent as Authorization: Bearer <token>" }
        user: { $ref: "#/components/schemas/User" }

    SignedUpload:
      type: object
      required: [uploadUrl, fields, publicUrl]
      properties:
        uploadUrl: { type: string, format: uri }
        fields: { type: object, additionalProperties: { type: string } }
        publicUrl: { type: string, format: uri, description: Value to send back in CreateComplaintRequest.imageUrls }
        maxFileSize: { type: integer, example: 5242880 }

    CreateComplaintRequest:
      type: object
      required: [category, title, description]
      properties:
        category: { $ref: "#/components/schemas/CategoryKey" }
        subIssue: { type: string, maxLength: 120, description: One of Category.subIssues or custom }
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 3000 }
        priority: { $ref: "#/components/schemas/Priority" }
        location: { type: string, maxLength: 120, description: e.g. "Lab 3, Block B" }
        imageUrls:
          type: array
          maxItems: 3
          description: |
            Only URLs returned by /uploads/sign for the SUBMITTING user (configured Cloudinary cloud and the
            user's own folder) are accepted. Other URLs -> 422.
          items: { type: string, format: uri }
        anonymousToStaff:
          type: boolean
          default: false
          description: Hide student name from department admins (super admin still sees it)

    UpdateStatusRequest:
      type: object
      required: [status, rowVersion]
      properties:
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        rowVersion: { type: string, format: uuid, description: "Value of Complaint.rowVersion from your last read" }
        remark:
          type: string
          maxLength: 2000
          description: REQUIRED when status is RESOLVED or REJECTED. Shown to the student.

    Complaint:
      type: object
      required: [id, rowVersion, ticket, title, category, department, status, priority, supportCount, createdAt, updatedAt, isOverdue]
      properties:
        id: { type: string }
        rowVersion: { type: string, format: uuid, description: Optimistic-concurrency token; echo it in PATCH status }
        ticket: { type: string, example: CC-2026-0042, description: Human-friendly reference }
        title: { type: string }
        description: { type: string }
        category: { $ref: "#/components/schemas/CategoryKey" }
        subIssue: { type: [string, "null"] }
        department: { $ref: "#/components/schemas/Department" }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        location: { type: [string, "null"] }
        imageUrls: { type: array, items: { type: string, format: uri } }
        supportCount: { type: integer, description: Number of "me too" supporters (excluding author) }
        supportedByMe: { type: boolean }
        isOverdue: { type: boolean, description: "Server-computed SLA flag: open longer than SLA for its priority (HIGH 24h, MEDIUM 72h, LOW 7d)" }
        dueAt: { type: string, format: date-time }
        author:
          oneOf: [{ $ref: "#/components/schemas/PublicUser" }, { type: "null" }]
          description: null when anonymousToStaff and caller is DEPT_ADMIN
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }

    PublicUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        studentId: { type: [string, "null"] }

    TimelineEntry:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [CREATED, STATUS_CHANGE, REMARK, STUDENT_REPLY] }
        fromStatus: { oneOf: [{ $ref: "#/components/schemas/ComplaintStatus" }, { type: "null" }] }
        toStatus: { oneOf: [{ $ref: "#/components/schemas/ComplaintStatus" }, { type: "null" }] }
        body: { type: [string, "null"] }
        actor:
          type: object
          required: [name, role]
          properties:
            name: { type: string }
            role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }

    Feedback:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }

    ComplaintDetail:
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          required: [timeline]
          properties:
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }
            feedback:
              oneOf: [{ $ref: "#/components/schemas/Feedback" }, { type: "null" }]
            allowedTransitions:
              type: array
              description: Statuses the caller may move this complaint to right now (UI uses this to render the action menu; server still re-validates)
              items: { $ref: "#/components/schemas/ComplaintStatus" }

    ComplaintPage:
      type: object
      required: [data, page, pageSize, total]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Complaint" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    SupportState:
      type: object
      required: [supportCount, supportedByMe]
      properties:
        supportCount: { type: integer }
        supportedByMe: { type: boolean }

    Notification:
      type: object
      required: [id, message, complaintId, read, createdAt]
      properties:
        id: { type: string }
        message: { type: string }
        complaintId: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    Summary:
      type: object
      required: [total, pending, inProgress, resolved, rejected, overdue]
      properties:
        total: { type: integer }
        pending: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        rejected: { type: integer }
        overdue: { type: integer }
        avgResolutionHours: { type: [number, "null"] }
        avgRating: { type: [number, "null"] }

    DepartmentCount:
      type: object
      required: [department, count]
      properties:
        department: { $ref: "#/components/schemas/Department" }
        count: { type: integer }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        count: { type: integer }

    TrendPoint:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    RecurringIssue:
      type: object
      required: [category, subIssue, count, supportTotal]
      properties:
        category: { $ref: "#/components/schemas/CategoryKey" }
        subIssue: { type: string }
        count: { type: integer }
        supportTotal: { type: integer }
