name: Frontend APK
on:
  push:
    branches: [main, fe/**]
    paths: ['frontend/**', '.github/workflows/frontend-apk.yml']
  pull_request:
    paths: ['frontend/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Change the server address without editing code: Settings > Secrets and variables > Actions > Variables > API_BASE_URL
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://13.53.165.254/api/v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: campusconnect-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
  # CD: every green build of main is published as the rolling "latest" release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: campusconnect-apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest app-release.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CampusConnect APK (latest main)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Talks to the live API. Debug-signed: uninstall an older build before installing this one."
