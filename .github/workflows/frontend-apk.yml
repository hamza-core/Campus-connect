name: Frontend APK
on:
  push:
    branches: [main, fe/**]
    paths: ['frontend/**', '.github/workflows/frontend-apk.yml']
  pull_request:
    paths: ['frontend/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: http://13.53.165.254/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: campusconnect-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
